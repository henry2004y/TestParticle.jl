name: Benchmarks

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'test/**'
      - 'docs/**'
      - 'examples/**'
      - 'bindings/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/DocPreviewCleanup.yml'
      - '.github/workflows/Documenter.yml'
      - '.github/workflows/Format.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/publish-python.yml'
      - '.github/workflows/python-wrapper.yml'

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
