name: Benchmarks

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'test/**'
      - 'docs/**'
      - 'examples/**'
      - 'bindings/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/DocPreviewCleanup.yml'
      - '.github/workflows/Documenter.yml'
      - '.github/workflows/Format.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/publish-python.yml'
      - '.github/workflows/python-wrapper.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true'

      - name: Prepare benchmark comment artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "${{ runner.temp }}/benchmark-comment"
          cp body.md "${{ runner.temp }}/benchmark-comment/body.md"
          printf '%s' "$PR_NUMBER" > "${{ runner.temp }}/benchmark-comment/pr_number.txt"

      - name: Upload benchmark comment artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: ${{ runner.temp }}/benchmark-comment
          retention-days: 1
          if-no-files-found: error
