name: Benchmarks

on:
  pull_request_target:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'test/**'
      - 'docs/**'
      - 'examples/**'
permissions:
  pull-requests: write    # action needs to post a comment

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          # The benchmark environment is declared in benchmark/Project.toml, so freeze the
          # script and its dependencies to this branch instead of the default branch: the
          # copy on master still points BorisPushers at a path outside the runner.
          bench-on: ${{ github.event.pull_request.head.sha }}
