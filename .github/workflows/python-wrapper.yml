name: Python Wrapper
on:
  pull_request:
    branches:
      - master
    paths:
      - 'bindings/python/**'
      - 'lib/BorisPushers/**'
      - 'Project.toml'
      - '.github/workflows/python-wrapper.yml'
  push:
    branches:
      - master
    paths:
      - 'bindings/python/**'
      - 'lib/BorisPushers/**'
      - 'Project.toml'
      - '.github/workflows/python-wrapper.yml'
env:
  JULIA_NUM_THREADS: 2
jobs:
  test:
    name: Python ${{ matrix.python }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.x'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Develop against the local Julia packages
        # The published wrapper resolves TestParticle and BorisPushers from the
        # Julia registry. In this monorepo we instead point both at the local
        # checkout, so the wrapper is tested against the in-repo source and the
        # TestParticleBorisPushersExt extension is built from the local pair.
        # This writes an environment-local override and leaves the packaged
        # juliapkg.json clean.
        run: |
          python -c "from juliapkg import add; add('TestParticle', uuid='953b605b-f162-4481-8f7f-a191c2bb40e3', dev=True, path=r'${{ github.workspace }}')"
          python -c "from juliapkg import add; add('BorisPushers', uuid='1e8b2ed2-ea1c-4b6e-b3f5-67c29d6bd197', dev=True, path=r'${{ github.workspace }}/lib/BorisPushers')"
      - name: Run wrapper tests
        run: python -m pytest tests -v
