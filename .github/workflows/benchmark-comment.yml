name: Benchmark Comment

on:
  workflow_run:
    workflows: [ Benchmarks ]
    types: [ completed ]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark comment artifact
        uses: actions/download-artifact@v8
        with:
          name: benchmark-comment
          path: ${{ runner.temp }}/benchmark-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const prNumberRaw = fs
              .readFileSync(`${process.env.RUNNER_TEMP}/benchmark-comment/pr_number.txt`, 'utf8')
              .trim();
            if (!/^\d+$/.test(prNumberRaw)) {
              core.setFailed(`Invalid PR number: ${prNumberRaw}`);
              return;
            }
            const pull_number = Number(prNumberRaw);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            const run = context.payload.workflow_run;
            if (
              pr.head.repo?.full_name !== run.head_repository?.full_name ||
              pr.head.ref !== run.head_branch
            ) {
              core.setFailed(
                `PR #${pull_number} (${pr.head.repo?.full_name}:${pr.head.ref}) does not match workflow run (${run.head_repository?.full_name}:${run.head_branch})`
              );
              return;
            }
            core.setOutput('number', String(pull_number));

      - name: Find existing benchmark comment
        id: find
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Benchmark Results (Julia v1)'

      - name: Create or update benchmark comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: ${{ runner.temp }}/benchmark-comment/body.md
          edit-mode: replace
