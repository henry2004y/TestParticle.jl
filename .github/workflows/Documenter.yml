name: Documenter
on:
  push:
    branches: [master]
    tags: ['*']
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'test/**'
      - 'benchmark/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/Format.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/publish-python.yml'
      - '.github/workflows/python-wrapper.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'test/**'
      - 'benchmark/**'
      - '.github/workflows/CI.yml'
      - '.github/workflows/Format.yml'
      - '.github/workflows/TagBot.yml'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/publish-python.yml'
      - '.github/workflows/python-wrapper.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v3
      - name: Cache Node dependencies
        uses: actions/cache@v6
        with:
          path: docs/node_modules
          key: ${{ runner.os }}-docs-node-modules-${{ hashFiles('docs/package.json') }}
          restore-keys: |
            ${{ runner.os }}-docs-node-modules-
      - name: Cache generated examples
        uses: actions/cache@v6
        with:
          path: |
            docs/src/drifts
            docs/src/analytic
            docs/src/applications
            docs/src/features
          key: ${{ runner.os }}-doc-examples-${{ hashFiles('docs/examples/**', 'docs/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-doc-examples-
      - name: Build and deploy docs
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          GKSwstype: "100" # for Plots.jl plots (if you have them)
          JULIA_DEBUG: "Documenter"
          DATADEPS_ALWAYS_ACCEPT: true
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v6
        with: 
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
